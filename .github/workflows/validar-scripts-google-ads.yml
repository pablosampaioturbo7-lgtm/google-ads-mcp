name: Validar scripts do Google Ads

on:
  push:
    branches: [ turbo7 ]
    paths: [ "google-ads-scripts/**" ]
  pull_request:
    paths: [ "google-ads-scripts/**" ]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar sintaxe de cada script
        run: |
          set -e
          for f in google-ads-scripts/*.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "OK $f"
          done
      - name: Conferir limites de texto do anuncio de teste
        run: |
          node -e "
            const src = require('fs').readFileSync('google-ads-scripts/turbo7_teste_anuncio.js','utf8');
            const pick = k => JSON.parse(src.match(new RegExp(k + ': (\\\\[[\\\\s\\\\S]*?\\\\])'))[1].replace(/'/g, '\"'));
            const t = pick('TITULOS'), d = pick('DESCRICOES');
            const ruins = [...t.filter(x => x.length > 30), ...d.filter(x => x.length > 90)];
            if (ruins.length) { console.error('Acima do limite:', ruins); process.exit(1); }
            console.log('Titulos e descricoes dentro do limite.');
          "
      - name: Validar fila de comandos
        run: |
          node -e "
            const f = JSON.parse(require('fs').readFileSync('google-ads-scripts/fila/fila.json','utf8'));
            const ids = new Set(); let erro = false;
            for (const c of f.comandos || []) {
              if (!c.id || !c.conta_id || !c.acao) { console.error('Comando incompleto', c); erro = true; }
              if (ids.has(c.id)) { console.error('id repetido', c.id); erro = true; } ids.add(c.id);
              for (const t of c.titulos || []) if (t.length > 30) { console.error('Titulo > 30:', t); erro = true; }
              for (const d of c.descricoes || []) if (d.length > 90) { console.error('Descricao > 90:', d); erro = true; }
            }
            if (erro) process.exit(1); console.log((f.comandos||[]).length + ' comando(s) valido(s).');
          "
